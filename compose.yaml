services:
  radio:
    image: linuxserver/ffmpeg:9.0.2
    command: >
      -re -stream_loop -1 -i /radio/stitched.mp4
      -re -stream_loop -1 -i /music/mix.m4a
      -map 0:v -map 1:a
      -c copy
      -f flv rtmp://live.twitch.tv/app/${TWITCH_KEY}
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    volumes:
      - ./radio:/radio:ro
      - ./music:/music:ro
    logging:
      options:
        max-size: "10m"
        max-file: "3"